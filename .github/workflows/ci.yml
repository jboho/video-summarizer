name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uvx ruff check .
      - name: Format check
        run: uvx ruff format --check .
      - name: Test
        # arvio is pinned to the v0.2.0 commit; REQUIRE_ARVIO turns the tests
        # that run it from skipped into failed when it is missing.
        env:
          REQUIRE_ARVIO: "1"
          ARVIO: "arvio @ git+https://github.com/jboho/arvio@196653e66f544da22aa54ea233567e12e9a2e579"
        run: uv run --python ${{ matrix.python-version }} --with pytest --with anthropic --with openai --with "$ARVIO" pytest -q -rs
